<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Price Estimator')}"></head>
<body>
	<div class="admin-layout">
		<aside th:replace="~{fragments/layout :: sidebar('optical-estimate')}"></aside>
		<div th:replace="~{fragments/layout :: backdrop}"></div>
		<div class="workspace">
			<header th:replace="~{fragments/layout :: topbar}"></header>
			<main class="content">
				<section class="user-create-page optical-page" aria-labelledby="optical-estimate-heading">
					<div class="page-heading">
						<h1 id="optical-estimate-heading">Price Estimator</h1>
						<a class="back-link"
						   th:if="${grantedAuthorities.contains('ROLE_ADMIN') or grantedAuthorities.contains('optical_store_config')}"
						   th:href="@{/optical-store/config}">Estimator configuration</a>
					</div>

					<div class="users-message error"
						 th:if="${#vars['org.springframework.validation.BindingResult.opticalEstimateForm'] != null and #vars['org.springframework.validation.BindingResult.opticalEstimateForm'].hasErrors()}">
						Please fix the highlighted estimate values.
					</div>

					<div class="optical-estimate-layout">
						<form class="intake-create-form optical-estimate-form"
							  th:action="@{/optical-store/estimate}"
							  th:object="${opticalEstimateForm}"
							  method="post"
							  data-estimate-form
							  th:attr="data-eye-exam-price=${config.eyeExamPrice},
									   data-exam-discount=${config.examDiscountWithCompleteGlasses},
									   data-outside-rx-discount=${config.outsidePrescriptionDiscount},
									   data-lens-discount=${config.lensDiscountWithoutInsurance},
									   data-pof-charge=${config.pofCharge}">
							<fieldset class="optical-fieldset">
								<legend>Do you have insurance?</legend>
								<div class="optical-choice-row">
									<label class="intake-checkbox">
										<input type="radio" th:field="*{hasInsurance}" th:value="true" data-insurance-control>
										<span>Yes</span>
									</label>
									<label class="intake-checkbox">
										<input type="radio" th:field="*{hasInsurance}" th:value="false" data-insurance-control>
										<span>No</span>
									</label>
								</div>
								<div class="field-group optical-insurance-discount" data-insurance-discount>
									<label for="insurance-discount">Insurance discount</label>
									<input id="insurance-discount" class="form-control" type="number" step="0.01" min="0" th:field="*{insuranceDiscount}">
									<div class="field-error" th:errors="*{insuranceDiscount}"></div>
								</div>
							</fieldset>

							<fieldset class="optical-fieldset">
								<legend>What is the customer buying?</legend>
								<div class="intake-checkbox-grid optical-purchase-grid">
									<label class="intake-checkbox">
										<input type="checkbox" th:field="*{buyingEyeExam}" data-eye-exam>
										<span>Eye exam</span>
									</label>
									<label class="intake-checkbox">
										<input type="checkbox" th:field="*{buyingFrame}" data-frame-control>
										<span>Frame</span>
									</label>
									<label class="intake-checkbox">
										<input type="checkbox" th:field="*{buyingPof}" data-pof-control>
										<span>POF</span>
									</label>
									<label class="intake-checkbox">
										<input type="checkbox" th:field="*{buyingLenses}" data-lenses-control>
										<span>Lenses</span>
									</label>
								</div>

								<div class="optical-dependent-grid">
									<div class="field-group" data-frame-fields>
										<label for="frame-price">Frame price</label>
										<input id="frame-price" class="form-control" type="number" step="0.01" min="0" th:field="*{framePrice}">
										<div class="field-error" th:errors="*{framePrice}"></div>
									</div>
									<div class="field-group" data-frame-fields>
										<label for="frame-discount">Frame discount</label>
										<select id="frame-discount" class="form-control" th:field="*{selectedFrameDiscountPercent}">
											<option value="0">0%</option>
											<option th:each="option : ${config.frameDiscountOptions}"
													th:value="${option}"
													th:text="|${option}%|">10%</option>
										</select>
										<div class="field-error" th:errors="*{selectedFrameDiscountPercent}"></div>
									</div>
									<div class="field-group optical-wide-field" data-lens-type-field>
										<label for="lens-type">Lens type</label>
										<select id="lens-type" class="form-control" th:field="*{lensTypeName}">
											<option value="">Select lens type</option>
											<option th:each="lens : ${config.lensPrices}"
													th:value="${lens.name()}"
													th:attr="data-price=${lens.price()}"
													th:text="|${lens.name()} - $${#numbers.formatDecimal(lens.price(), 1, 'COMMA', 2, 'POINT')}|">Lens type</option>
										</select>
										<div class="field-error" th:errors="*{lensTypeName}"></div>
									</div>
									<div class="field-group optical-wide-field" data-lens-coating-field>
										<label for="lens-protection-coating">Lens protection coating</label>
										<select id="lens-protection-coating" class="form-control" th:field="*{lensProtectionCoatingName}">
											<option value="" data-price="0">None</option>
											<option th:each="coating : ${config.lensProtectionCoatings}"
													th:value="${coating.name()}"
													th:attr="data-price=${coating.price()}"
													th:text="|${coating.name()} - $${#numbers.formatDecimal(coating.price(), 1, 'COMMA', 2, 'POINT')}|">Coating</option>
										</select>
									</div>
									<div class="field-group optical-wide-field" data-lens-option-field>
										<label for="lens-option">Lens option</label>
										<select id="lens-option" class="form-control" th:field="*{lensOptionName}">
											<option value="">Select lens option</option>
											<option th:each="option : ${config.lensOptionCharges}"
													th:value="${option.name()}"
													th:attr="data-charge=${option.charge()}"
													th:text="|${option.name()} - $${#numbers.formatDecimal(option.charge(), 1, 'COMMA', 2, 'POINT')}|">Regular</option>
										</select>
									</div>
								</div>
							</fieldset>

							<fieldset class="optical-fieldset">
								<legend>Prescription source</legend>
								<div class="optical-choice-row">
									<label class="intake-checkbox">
										<input type="radio" th:field="*{prescriptionSource}" value="EXAM_HERE" data-exam-here>
										<span>Exam here</span>
									</label>
									<label class="intake-checkbox">
										<input type="radio" th:field="*{prescriptionSource}" value="OUTSIDE_RX" data-outside-rx>
										<span>Outside Rx</span>
									</label>
								</div>
							</fieldset>

						</form>

						<aside class="optical-summary" aria-labelledby="estimate-summary-heading">
							<h2 id="estimate-summary-heading">Estimate Summary</h2>
							<div class="users-table-wrapper" data-estimate-summary-table hidden>
								<table class="users-table optical-summary-table">
									<tbody data-estimate-summary-lines>
									</tbody>
								</table>
							</div>
							<div class="empty-results optical-empty-summary" data-estimate-empty-summary>
								No estimate calculated.
							</div>
						</aside>
					</div>
				</section>
			</main>
		</div>
	</div>
	<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
