<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Referral Source')}"></head>
<body>
	<div class="admin-layout">
		<aside th:replace="~{fragments/layout :: sidebar('referral-source')}"></aside>
		<div th:replace="~{fragments/layout :: backdrop}"></div>
		<div class="workspace">
			<header th:replace="~{fragments/layout :: topbar}"></header>
			<main class="content">
				<section class="referral-report-page" aria-labelledby="referral-report-heading">
					<div class="referral-report-heading">
						<h1 id="referral-report-heading">Referral Source</h1>
						<form class="referral-month-filter" th:action="@{/referral-source}" method="get">
							<label for="report-month">Month</label>
							<select id="report-month"
									class="form-control"
									name="month"
									data-referral-month-select>
								<option th:each="availableMonth : ${report.availableMonths}"
										th:value="${availableMonth.value}"
										th:text="${availableMonth.label}"
										th:selected="${availableMonth.value == report.selectedMonth}">
									June, 2026
								</option>
							</select>
						</form>
					</div>

					<div class="referral-report-grid">
						<section class="referral-report-panel" aria-labelledby="referral-counts-heading">
							<div class="referral-panel-heading">
								<h2 id="referral-counts-heading">Referral Sources</h2>
								<span class="referral-total" th:text="|${report.total} total|">0 total</span>
							</div>
							<ul class="referral-source-list">
								<li th:each="item : ${report.items}">
									<span class="referral-source-name">
										<span class="referral-color-swatch"
											  th:style="|background-color: ${item.color}|"
											  aria-hidden="true"></span>
										<span th:text="${item.name}">Referral source</span>
									</span>
									<strong th:text="${item.count}">0</strong>
								</li>
							</ul>
						</section>

						<section class="referral-report-panel referral-chart-panel" aria-labelledby="referral-chart-heading">
							<div class="referral-panel-heading">
								<h2 id="referral-chart-heading">Referral Distribution</h2>
							</div>
							<div class="referral-chart-area">
								<div class="referral-pie-chart"
									 th:style="|background: ${report.chartBackground}|"
									 th:attr="aria-label=|Referral source distribution with ${report.total} total referrals|"
									 role="img">
									<div class="referral-chart-center">
										<strong th:text="${report.total}">0</strong>
										<span>Referrals</span>
									</div>
								</div>
								<p class="referral-empty-chart" th:if="${report.total == 0}">
									No referrals recorded for this month.
								</p>
							</div>
						</section>
					</div>
				</section>
			</main>
		</div>
	</div>
	<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
