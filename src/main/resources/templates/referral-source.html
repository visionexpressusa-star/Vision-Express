<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Referral Source')}"></head>
<body>
	<div class="admin-layout">
		<aside th:replace="~{fragments/layout :: sidebar('referral-source')}"></aside>
		<div th:replace="~{fragments/layout :: backdrop}"></div>
		<div class="workspace">
			<header th:replace="~{fragments/layout :: topbar}"></header>
			<main class="content">
				<section class="referral-report-page" aria-labelledby="referral-report-heading">
					<div class="referral-report-heading">
						<h1 id="referral-report-heading">Referral Source</h1>
						<form class="referral-report-filter" th:action="@{/referral-source}" method="get">
							<div class="referral-period-options" role="radiogroup" aria-label="Report period">
								<label>
									<input type="radio"
										   name="period"
										   value="monthly"
										   th:checked="${report.selectedPeriod == 'monthly'}"
										   data-referral-filter-control>
									<span>Monthly</span>
								</label>
								<label>
									<input type="radio"
										   name="period"
										   value="yearly"
										   th:checked="${report.selectedPeriod == 'yearly'}"
										   data-referral-filter-control>
									<span>Yearly</span>
								</label>
							</div>
							<div class="referral-filter-field" th:if="${report.selectedPeriod == 'monthly'}">
								<label for="report-month">Month</label>
								<select id="report-month"
										class="form-control"
										name="month"
										data-referral-filter-control>
									<option th:each="availableMonth : ${report.availableMonths}"
											th:value="${availableMonth.value}"
											th:text="${availableMonth.label}"
											th:selected="${availableMonth.value == report.selectedMonth}">
										June, 2026
									</option>
								</select>
							</div>
							<div class="referral-filter-field" th:if="${report.selectedPeriod == 'yearly'}">
								<label for="report-year">Year</label>
								<select id="report-year"
										class="form-control"
										name="year"
										data-referral-filter-control>
									<option th:each="availableYear : ${report.availableYears}"
											th:value="${availableYear}"
											th:text="${availableYear}"
											th:selected="${availableYear == report.selectedYear}">
										2026
									</option>
								</select>
							</div>
						</form>
					</div>

					<div class="referral-report-grid" th:if="${report.selectedPeriod == 'monthly'}">
						<section class="referral-report-panel" aria-labelledby="referral-counts-heading">
							<div class="referral-panel-heading">
								<h2 id="referral-counts-heading">Referral Sources</h2>
								<span class="referral-total" th:text="|${report.total} total|">0 total</span>
							</div>
							<ul class="referral-source-list">
								<li th:each="item : ${report.items}">
									<span class="referral-source-name">
										<span class="referral-color-swatch"
											  th:style="|background-color: ${item.color}|"
											  aria-hidden="true"></span>
										<span th:text="${item.name}">Referral source</span>
									</span>
									<strong th:text="${item.count}">0</strong>
								</li>
							</ul>
						</section>

						<section class="referral-report-panel referral-chart-panel" aria-labelledby="referral-chart-heading">
							<div class="referral-panel-heading">
								<h2 id="referral-chart-heading">Referral Distribution</h2>
							</div>
							<div class="referral-chart-area">
								<div class="referral-pie-chart"
									 th:style="|background: ${report.chartBackground}|"
									 th:attr="aria-label=|Referral source distribution with ${report.total} total referrals|"
									 role="img">
									<div class="referral-chart-center">
										<strong th:text="${report.total}">0</strong>
										<span>Referrals</span>
									</div>
								</div>
								<p class="referral-empty-chart" th:if="${report.total == 0}">
									No referrals recorded for this month.
								</p>
							</div>
						</section>
					</div>

					<section class="referral-report-panel referral-yearly-panel"
							 th:if="${report.selectedPeriod == 'yearly'}"
							 aria-labelledby="referral-yearly-heading">
						<div class="referral-panel-heading">
							<h2 id="referral-yearly-heading" th:text="|Monthly Intake Forms - ${report.selectedYear}|">Monthly Intake Forms</h2>
							<span class="referral-total" th:text="|${report.yearTotal} total|">0 total</span>
						</div>
						<div class="referral-yearly-chart" th:if="${report.yearTotal > 0}">
							<div class="referral-yearly-bar"
								 th:each="month : ${report.yearMonths}"
								 th:attr="title=${month.tooltip}, aria-label=${month.tooltip}"
								 role="img">
								<div class="referral-yearly-bar-track">
									<div class="referral-yearly-bar-fill"
										 th:style="|height: ${month.heightPercent}%;|">
										<span th:text="${month.total}">0</span>
									</div>
								</div>
								<span class="referral-yearly-month" th:text="${month.monthLabel}">Jan</span>
							</div>
						</div>
						<p class="referral-empty-chart" th:if="${report.yearTotal == 0}">
							No referrals recorded for this year.
						</p>
					</section>
				</section>
			</main>
		</div>
	</div>
	<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
