<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Change Password')}"></head>
<body>
	<div class="admin-layout">
		<aside th:replace="~{fragments/layout :: sidebar('change-password')}"></aside>
		<div th:replace="~{fragments/layout :: backdrop}"></div>
		<div class="workspace">
			<header th:replace="~{fragments/layout :: topbar}"></header>
			<main class="content">
				<section class="user-create-page" aria-labelledby="change-password-heading">
					<div class="page-heading">
						<h1 id="change-password-heading">Change Password</h1>
					</div>

					<div class="users-message error" th:if="${formError}" th:text="${formError}">
						Unable to change password.
					</div>
					<div class="users-message success" th:if="${param.changed}">
						Password updated successfully.
					</div>

					<form class="create-user-form"
						  th:action="@{/change-password}"
						  th:object="${changePasswordForm}"
						  method="post">
						<div class="field-group">
							<label for="current-password">Current Password</label>
							<input id="current-password"
								   class="form-control"
								   type="password"
								   th:field="*{currentPassword}"
								   autocomplete="current-password"
								   required>
						</div>
						<div class="field-group">
							<label for="new-password">New Password</label>
							<input id="new-password"
								   class="form-control"
								   type="password"
								   th:field="*{newPassword}"
								   autocomplete="new-password"
								   required>
						</div>
						<div class="field-group">
							<label for="confirm-password">Confirm Password</label>
							<input id="confirm-password"
								   class="form-control"
								   type="password"
								   th:field="*{confirmPassword}"
								   autocomplete="new-password"
								   required>
						</div>

						<div class="form-actions">
							<button class="toolbar-button create-button" type="submit">Change Password</button>
						</div>
					</form>
				</section>
			</main>
		</div>
	</div>
	<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
