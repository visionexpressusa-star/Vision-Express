<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit User')}"></head>
<body>
	<div class="admin-layout">
		<aside th:replace="~{fragments/layout :: sidebar('users')}"></aside>
		<div th:replace="~{fragments/layout :: backdrop}"></div>
		<div class="workspace">
			<header th:replace="~{fragments/layout :: topbar}"></header>
			<main class="content">
				<section class="user-create-page" aria-labelledby="edit-user-heading">
					<div class="page-heading">
						<h1 id="edit-user-heading">Edit User</h1>
						<a class="back-link" th:href="@{/users}">Back to users</a>
					</div>

					<div class="users-message error" th:if="${formError}" th:text="${formError}">
						Unable to update user.
					</div>

					<form class="create-user-form"
						  th:action="@{/users/{id}/edit(id=${userId})}"
						  th:object="${editUserForm}"
						  method="post">
						<div class="field-group">
							<label for="display-name">Display Name</label>
							<input id="display-name"
								   class="form-control"
								   type="text"
								   th:field="*{displayName}"
								   autocomplete="name"
								   required>
						</div>
						<div class="field-group">
							<label for="username">Username</label>
							<input id="username"
								   class="form-control readonly-field"
								   type="text"
								   th:field="*{username}"
								   readonly>
						</div>

						<fieldset class="permission-fieldset">
							<legend>Permissions</legend>
							<p>Select the permissions this user can access.</p>
							<div class="permission-options">
								<label class="permission-option" th:each="permission : ${permissions}">
									<input type="checkbox"
										   th:field="*{permissionIds}"
										   th:value="${permission.id}">
									<span>
										<strong th:text="${permission.name}">intake_form</strong>
										<small th:text="${permission.description}">Manage intake forms</small>
									</span>
								</label>
							</div>
						</fieldset>

						<div class="form-actions">
							<a class="cancel-button" th:href="@{/users}">Cancel</a>
							<button class="toolbar-button create-button" type="submit">Save User</button>
						</div>
					</form>
				</section>
			</main>
		</div>
	</div>
	<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
