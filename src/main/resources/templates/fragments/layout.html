<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${pageTitle + ' | Vision Express'}">Vision Express</title>
	<link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
	<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
	<aside th:fragment="sidebar(activePage)" class="sidebar" id="sidebar-navigation">
		<div class="sidebar-header">
			<a class="brand" th:href="@{/}" aria-label="Vision Express home">
				<img th:src="@{/images/ve-logo.png}" alt="Vision Express">
			</a>
			<button class="sidebar-close" type="button" data-menu-close aria-label="Close navigation">
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<path d="M6 6l12 12M18 6 6 18"/>
				</svg>
			</button>
		</div>

		<nav class="menu nav" aria-label="Main navigation">
			<a class="menu-link"
			   th:href="@{/}"
			   th:classappend="${activePage == 'dashboard'} ? ' active' : ''">
				<span class="menu-icon" aria-hidden="true">
					<svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
				</span>
				Dashboard
			</a>
			<a class="menu-link"
			   th:if="${grantedAuthorities.contains('ROLE_ADMIN') or grantedAuthorities.contains('intake_form')}"
			   th:href="@{/intake-form}"
			   th:classappend="${activePage == 'intake-form'} ? ' active' : ''">
				<span class="menu-icon" aria-hidden="true">
					<svg viewBox="0 0 24 24"><path d="M7 3h10a2 2 0 0 1 2 2v16H5V5a2 2 0 0 1 2-2zm2 5h6M9 12h6M9 16h4"/></svg>
				</span>
				Intake Form
			</a>
			<a class="menu-link"
			   th:href="@{/referral-source}"
			   th:classappend="${activePage == 'referral-source'} ? ' active' : ''">
				<span class="menu-icon" aria-hidden="true">
					<svg viewBox="0 0 24 24"><path d="M12 3v9h9A9 9 0 1 1 12 3zm3 0a6 6 0 0 1 6 6h-6z"/></svg>
				</span>
				Referral Source
			</a>
			<a class="menu-link"
			   th:if="${grantedAuthorities.contains('ROLE_ADMIN') or grantedAuthorities.contains('inventory_check')}"
			   th:href="@{/inventory-tracking}"
			   th:classappend="${activePage == 'inventory-tracking'} ? ' active' : ''">
				<span class="menu-icon" aria-hidden="true">
					<svg viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5zM4 7.5l8 4.5 8-4.5M12 12v9"/></svg>
				</span>
				Inventory Tracking
			</a>
			<a class="menu-link"
			   th:href="@{/change-password}"
			   th:classappend="${activePage == 'change-password'} ? ' active' : ''">
				<span class="menu-icon" aria-hidden="true">
					<svg viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5zM12 15v2"/></svg>
				</span>
				Change Password
			</a>
			<a class="menu-link"
			   th:if="${grantedAuthorities.contains('ROLE_ADMIN') or grantedAuthorities.contains('users')}"
			   th:href="@{/users}"
			   th:classappend="${activePage == 'users'} ? ' active' : ''">
				<span class="menu-icon" aria-hidden="true">
					<svg viewBox="0 0 24 24"><path d="M16.5 20a5.5 5.5 0 0 0-11 0M11 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM17 12a3 3 0 1 0 0-6M19 20a4.5 4.5 0 0 0-3.2-4.3"/></svg>
				</span>
				Users
			</a>
		</nav>
	</aside>

	<div th:fragment="backdrop" class="sidebar-backdrop" data-menu-close></div>

	<header th:fragment="topbar" class="topbar">
		<div class="mobile-branding">
			<button class="menu-toggle" type="button" data-menu-toggle
					aria-controls="sidebar-navigation" aria-expanded="false" aria-label="Open navigation">
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<path d="M3 6h18M3 12h18M3 18h18"/>
				</svg>
			</button>
			<a class="mobile-brand" th:href="@{/}" aria-label="Vision Express home">
				<img th:src="@{/images/ve-logo.png}" alt="Vision Express">
			</a>
		</div>
		<div class="account">
			<span class="account-name" th:text="${loggedInDisplayName}">Display Name</span>
			<form th:action="@{/logout}" method="post">
				<button class="action-button logout" type="submit">Logout</button>
			</form>
		</div>
	</header>

	<script th:fragment="scripts" th:src="@{/js/admin.js}"></script>
</body>
</html>
