<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create Intake Form')}"></head>
<body>
	<div class="admin-layout">
		<aside th:replace="~{fragments/layout :: sidebar('intake-form')}"></aside>
		<div th:replace="~{fragments/layout :: backdrop}"></div>
		<div class="workspace">
			<header th:replace="~{fragments/layout :: topbar}"></header>
			<main class="content">
				<section class="user-create-page" aria-labelledby="create-intake-form-heading">
					<div class="page-heading">
						<h1 id="create-intake-form-heading">Create Intake Form</h1>
						<a class="back-link" th:href="@{/intake-form}">Back to intake forms</a>
					</div>

					<div class="users-message error" th:if="${formError}" th:text="${formError}">
						Unable to create intake form.
					</div>

					<form class="intake-create-form"
						  th:action="@{/intake-form/create}"
						  th:object="${createIntakeFormForm}"
						  method="post">
						<div class="intake-field-row intake-identity-row">
							<div class="field-group">
								<label for="account-id">Account ID</label>
								<input id="account-id"
									   class="form-control"
									   type="text"
									   th:field="*{accountId}"
									   required>
							</div>
							<div class="field-group">
								<label for="patient-name">Patient Name</label>
								<input id="patient-name"
									   class="form-control"
									   type="text"
									   th:field="*{fullName}"
									   required>
							</div>
							<div class="field-group pd-field">
								<label for="pd-right">PD Right</label>
								<input id="pd-right"
									   class="form-control"
									   type="text"
									   th:field="*{pdRight}"
									   required>
							</div>
							<div class="field-group pd-field">
								<label for="pd-left">PD Left</label>
								<input id="pd-left"
									   class="form-control"
									   type="text"
									   th:field="*{pdLeft}"
									   required>
							</div>
						</div>

						<div class="intake-checkbox-grid">
							<label class="intake-checkbox">
								<input type="checkbox" th:field="*{retinalImagingRequired}">
								<span>Required Retinal Imaging?</span>
							</label>
							<label class="intake-checkbox">
								<input type="checkbox" th:field="*{doingEyeglasses}">
								<span>Required Eyeglasses?</span>
							</label>
							<label class="intake-checkbox">
								<input type="checkbox" th:field="*{doingContactLens}">
								<span>Required Contact Lens?</span>
							</label>
						</div>

						<div class="insurance-row">
							<label class="intake-checkbox">
								<input type="checkbox" th:field="*{hasInsurance}">
								<span>Has insurance?</span>
							</label>
							<div class="field-group insurance-name-field">
								<label class="visually-hidden" for="insurance-name">Insurance name</label>
								<input id="insurance-name"
									   class="form-control"
									   type="text"
									   th:field="*{insuranceName}"
									   placeholder="Insurance name">
							</div>
						</div>

						<fieldset class="visual-acuity-fieldset">
							<legend>Visual Acuity</legend>
							<label class="intake-checkbox aided-checkbox">
								<input type="checkbox" th:field="*{aided}">
								<span>Aided - is the patient wearing glasses or contacts?</span>
							</label>
							<div class="visual-acuity-table-wrapper">
								<table class="visual-acuity-table">
									<thead>
										<tr>
											<th scope="col">Eye</th>
											<th scope="col">8</th>
											<th scope="col">7</th>
											<th scope="col">6</th>
											<th scope="col">5</th>
											<th scope="col">4</th>
											<th scope="col">3</th>
											<th scope="col">2</th>
											<th scope="col">1</th>
										</tr>
									</thead>
									<tbody>
										<tr>
											<th scope="row">Right (OD)</th>
											<td class="visual-cell" th:each="value : ${ {20, 25, 30, 40, 50, 60, 70, 80} }">
												<label>
													<input type="radio" th:field="*{vaRight}" th:value="|20/${value}|" required>
													<span th:text="|20/${value}|">20/20</span>
												</label>
											</td>
										</tr>
										<tr>
											<th scope="row">Left (OS)</th>
											<td class="visual-cell" th:each="value : ${ {20, 25, 30, 40, 50, 60, 70, 80} }">
												<label>
													<input type="radio" th:field="*{vaLeft}" th:value="|20/${value}|" required>
													<span th:text="|20/${value}|">20/20</span>
												</label>
											</td>
										</tr>
										<tr>
											<th scope="row">Both (OU)</th>
											<td class="visual-cell" th:each="value : ${ {20, 25, 30, 40, 50, 60, 70, 80} }">
												<label>
													<input type="radio" th:field="*{vaBoth}" th:value="|20/${value}|" required>
													<span th:text="|20/${value}|">20/20</span>
												</label>
											</td>
										</tr>
									</tbody>
								</table>
							</div>
						</fieldset>

						<fieldset class="intake-checklist" data-checklist-gate>
							<legend>Checklist</legend>
							<div class="checklist-items">
								<div class="checklist-row" th:each="item : ${checklistItems}">
									<label class="intake-checkbox">
										<input type="checkbox" th:field="*{checkedChecklistItemIds}" th:value="${item.id}">
										<span th:text="${item.checklistItem}">Checklist item</span>
									</label>
								</div>
							</div>
						</fieldset>

						<div class="field-group intake-referral-source">
							<label for="referral-source">How did you hear about us?</label>
							<select id="referral-source"
									class="form-control"
									th:field="*{referralSourceId}"
									required>
								<option value="">Select one</option>
								<option th:each="referralSource : ${referralSources}"
										th:value="${referralSource.id}"
										th:text="${referralSource.name}">Referral source</option>
							</select>
						</div>

						<div class="form-actions">
							<a class="cancel-button" th:href="@{/intake-form}">Cancel</a>
							<button class="toolbar-button create-button hidden-save-button" type="submit" data-checklist-save hidden>Save</button>
						</div>
					</form>
				</section>
			</main>
		</div>
	</div>
	<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
