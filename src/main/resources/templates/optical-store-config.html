<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Estimator Configuration')}"></head>
<body>
	<div class="admin-layout">
		<aside th:replace="~{fragments/layout :: sidebar('optical-config')}"></aside>
		<div th:replace="~{fragments/layout :: backdrop}"></div>
		<div class="workspace">
			<header th:replace="~{fragments/layout :: topbar}"></header>
			<main class="content">
				<section class="user-create-page optical-page" aria-labelledby="optical-config-heading">
					<div class="page-heading">
						<h1 id="optical-config-heading">Estimator Configuration</h1>
						<a class="back-link" th:href="@{/optical-store/estimate}">Open estimator</a>
					</div>

					<div class="users-message success" th:if="${param.saved}">
						Configuration saved successfully.
					</div>
					<div class="users-message error"
						 th:if="${#vars['org.springframework.validation.BindingResult.opticalStoreConfigForm'] != null and #vars['org.springframework.validation.BindingResult.opticalStoreConfigForm'].hasErrors()}">
						Please fix the highlighted configuration values.
					</div>

					<form class="optical-config-form"
						  th:action="@{/optical-store/config}"
						  th:object="${opticalStoreConfigForm}"
						  method="post"
						  data-optical-config-form>
						<div class="optical-config-grid">
							<div class="field-group">
								<label for="eye-exam-price">Eye exam price</label>
								<input id="eye-exam-price" class="form-control" type="number" step="0.01" min="0" th:field="*{eyeExamPrice}">
								<div class="field-error" th:errors="*{eyeExamPrice}"></div>
							</div>
							<div class="field-group">
								<label for="exam-discount">Exam discount with complete glasses</label>
								<input id="exam-discount" class="form-control" type="number" step="0.01" min="0" th:field="*{examDiscountWithCompleteGlasses}">
								<div class="field-error" th:errors="*{examDiscountWithCompleteGlasses}"></div>
							</div>
							<div class="field-group">
								<label for="outside-rx-discount">Outside prescription discount</label>
								<input id="outside-rx-discount" class="form-control" type="number" step="0.01" min="0" th:field="*{outsidePrescriptionDiscount}">
								<div class="field-error" th:errors="*{outsidePrescriptionDiscount}"></div>
							</div>
							<div class="field-group">
								<label for="lens-discount">Lens discount without insurance</label>
								<input id="lens-discount" class="form-control" type="number" step="0.01" min="0" th:field="*{lensDiscountWithoutInsurance}">
								<div class="field-error" th:errors="*{lensDiscountWithoutInsurance}"></div>
							</div>
							<div class="field-group">
								<label for="pof-charge">POF charge</label>
								<input id="pof-charge" class="form-control" type="number" step="0.01" min="0" th:field="*{pofCharge}">
								<div class="field-error" th:errors="*{pofCharge}"></div>
							</div>
						</div>

						<fieldset class="optical-fieldset">
							<legend>Frame Discount Options</legend>
							<div class="optical-discount-list" data-frame-discounts>
								<div class="field-group optical-inline-field"
									 th:each="option, optionStat : *{frameDiscountOptions}">
									<label th:for="|frame-discount-${optionStat.index}|">Discount %</label>
									<input th:id="|frame-discount-${optionStat.index}|"
										   class="form-control"
										   type="number"
										   step="0.01"
										   min="0"
										   max="100"
										   th:field="*{frameDiscountOptions[__${optionStat.index}__].percent}">
									<div class="field-error" th:errors="*{frameDiscountOptions[__${optionStat.index}__].percent}"></div>
								</div>
							</div>
						</fieldset>

						<fieldset class="optical-fieldset">
							<legend>Lens Option Charges</legend>
							<div class="users-table-wrapper">
								<table class="users-table optical-table">
									<thead>
										<tr>
											<th scope="col">Option</th>
											<th scope="col">Charge</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="option, optionStat : *{lensOptionCharges}">
											<td>
												<span th:text="${option.name}">Regular</span>
												<input type="hidden" th:field="*{lensOptionCharges[__${optionStat.index}__].name}">
											</td>
											<td>
												<input class="form-control"
													   type="number"
													   step="0.01"
													   min="0"
													   th:field="*{lensOptionCharges[__${optionStat.index}__].charge}">
												<div class="field-error" th:errors="*{lensOptionCharges[__${optionStat.index}__].charge}"></div>
											</td>
										</tr>
									</tbody>
								</table>
							</div>
						</fieldset>

						<fieldset class="optical-fieldset">
							<legend>Lens Protection Coatings</legend>
							<div class="users-table-wrapper">
								<table class="users-table optical-table" data-lens-coating-table>
									<thead>
										<tr>
											<th scope="col">Coating</th>
											<th scope="col">Price</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="coating, coatingStat : *{lensProtectionCoatings}">
											<td>
												<input class="form-control"
													   type="text"
													   th:field="*{lensProtectionCoatings[__${coatingStat.index}__].name}">
												<div class="field-error" th:errors="*{lensProtectionCoatings[__${coatingStat.index}__].name}"></div>
											</td>
											<td>
												<input class="form-control"
													   type="number"
													   step="0.01"
													   min="0"
													   th:field="*{lensProtectionCoatings[__${coatingStat.index}__].price}">
												<div class="field-error" th:errors="*{lensProtectionCoatings[__${coatingStat.index}__].price}"></div>
											</td>
										</tr>
									</tbody>
								</table>
							</div>
							<button class="table-action edit optical-add-row" type="button" data-add-coating-row>Add coating row</button>
						</fieldset>

						<fieldset class="optical-fieldset">
							<legend>Lens Price List</legend>
							<div class="users-table-wrapper">
								<table class="users-table optical-table" data-lens-price-table>
									<thead>
										<tr>
											<th scope="col">Lens type</th>
											<th scope="col">Price</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="lens, lensStat : *{lensPrices}">
											<td>
												<input class="form-control"
													   type="text"
													   th:field="*{lensPrices[__${lensStat.index}__].name}">
												<div class="field-error" th:errors="*{lensPrices[__${lensStat.index}__].name}"></div>
											</td>
											<td>
												<input class="form-control"
													   type="number"
													   step="0.01"
													   min="0"
													   th:field="*{lensPrices[__${lensStat.index}__].price}">
												<div class="field-error" th:errors="*{lensPrices[__${lensStat.index}__].price}"></div>
											</td>
										</tr>
									</tbody>
								</table>
							</div>
							<button class="table-action edit optical-add-row" type="button" data-add-lens-row>Add lens row</button>
						</fieldset>

						<div class="form-actions">
							<a class="cancel-button" th:href="@{/optical-store/estimate}">Cancel</a>
							<button class="toolbar-button create-button" type="submit">Save configuration</button>
						</div>
					</form>
				</section>
			</main>
		</div>
	</div>
	<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
