<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body class="login-body">
	<main class="login-page">
		<section class="login-card" aria-labelledby="login-heading">
			<img class="login-logo" th:src="@{/images/ve-logo.png}" alt="Vision Express">
			<h1 id="login-heading">Sign in</h1>
			<p class="login-subheading">Log in to access the internal portal.</p>

			<div class="login-message error" th:if="${param.error}">
				Invalid username or password.
			</div>
			<div class="login-message success" th:if="${param.logout}">
				You have been logged out.
			</div>

			<form class="login-form" th:action="@{/login}" method="post">
				<div>
					<label for="username">Username</label>
					<input id="username"
						   class="form-control"
						   type="text"
						   name="username"
						   autocomplete="username"
						   required
						   autofocus>
				</div>
				<div>
					<label for="password">Password</label>
					<input id="password"
						   class="form-control"
						   type="password"
						   name="password"
						   autocomplete="current-password"
						   required>
				</div>
				<button class="login-button" type="submit">Login</button>
			</form>
		</section>
	</main>
</body>
</html>
